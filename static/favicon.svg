<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 外框：工業倒角銘牌 -->
  <rect width="512" height="512" rx="104" fill="#070709"/>
  <path d="M 80 50 L 412 50 L 462 100 L 462 462 L 50 462 L 50 80 Z" fill="#0D0E12" stroke="#252732" stroke-width="3"/>

  <!-- 天圓：簡潔黑膠圓軌 -->
  <circle cx="256" cy="276" r="140" fill="none" stroke="#262834" stroke-width="12"/>
  <circle cx="256" cy="276" r="140" fill="none" stroke="#E0A96D" stroke-width="12" stroke-dasharray="240 600" stroke-linecap="round"/>

  <!-- 軸心定位 -->
  <circle cx="256" cy="276" r="26" fill="#15161C" stroke="#3A3D4C" stroke-width="4"/>
  <circle cx="256" cy="276" r="8" fill="#FF2A3C"/>

  <!-- 拾音臂：極簡幾何直角折線，自右上角機械座延伸至唱片軌道 -->
  <path d="M 400 130 L 320 130 L 256 220" 
        fill="none" 
        stroke="#F4F4F6" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- 唱臂基座螺栓 -->
  <circle cx="400" cy="130" r="12" fill="#E0A96D"/>
  
  <!-- 底部精確點陣 (象徵道生一，一生二，二生三) -->
  <circle cx="232" cy="432" r="4" fill="#585D6E"/>
  <circle cx="256" cy="432" r="4" fill="#E0A96D"/>
  <circle cx="280" cy="432" r="4" fill="#585D6E"/>
</svg>
